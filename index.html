<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Em Desenvolvimento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #009c3b 0%, #002776 100%);
            font-family: Arial, sans-serif;
        }

        .container {
            background-color: #ffffff;
            padding: 3rem 4rem;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            border: 4px solid #ffdf00;
        }

        h1 {
            color: #002776;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .bandeirinha {
            width: 60px;
            height: 40px;
            background-color: #009c3b;
            position: relative;
            margin: 0 auto 1.5rem;
            border-radius: 4px;
            overflow: hidden;
        }

        .bandeirinha::before {
            content: '';
            position: absolute;
            width: 35px;
            height: 35px;
            background-color: #ffdf00;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .bandeirinha::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            background-color: #002776;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="bandeirinha"></div>
        <h1>Em desenvolvimento</h1>
    </div>
</body>
</html>
