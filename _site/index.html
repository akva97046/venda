<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>exercitodolula.com.br está à venda</title>
  <meta name="description" content="O domínio exercitodolula.com.br está disponível para compra. Envie sua proposta.">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <main class="container">
    <section class="hero">
  <p class="badge">Domínio à venda</p>
  <h1>exercitodolula.com.br</h1>
  <p class="lead">Este domínio está disponível para compra. Preencha o formulário abaixo e envie sua proposta.</p>
</section>

<section class="card" aria-labelledby="form-title">
  <h2 id="form-title">Faça sua oferta</h2>

  <!-- Envio via FormSubmit.co: encaminha os dados para o e-mail configurado -->
  <form action="https://formsubmit.co/akva9706@gmail.com" method="POST">
    <input type="hidden" name="_subject" value="Nova proposta para exercitodolula.com.br">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_next" value="http://localhost:4000/obrigado/">
    <!-- Honeypot anti-spam: deve ficar vazio -->
    <input type="text" name="_honey" class="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">

    <div class="field">
      <label for="nome">Nome completo</label>
      <input type="text" id="nome" name="nome" required autocomplete="name">
    </div>

    <div class="field">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required autocomplete="email">
    </div>

    <div class="field">
      <label for="telefone">Telefone / WhatsApp <span class="optional">(opcional)</span></label>
      <input type="tel" id="telefone" name="telefone" autocomplete="tel">
    </div>

    <div class="field">
      <label for="oferta">Valor da oferta (R$)</label>
      <input type="number" id="oferta" name="oferta" min="1" step="0.01" required inputmode="decimal">
    </div>

    <div class="field">
      <label for="mensagem">Mensagem <span class="optional">(opcional)</span></label>
      <textarea id="mensagem" name="mensagem" rows="5"></textarea>
    </div>

    <button type="submit">Enviar proposta</button>
  </form>
</section>

  </main>
  <footer class="footer">
    <p>&copy; 2026 exercitodolula.com.br</p>
  </footer>
</body>
</html>
